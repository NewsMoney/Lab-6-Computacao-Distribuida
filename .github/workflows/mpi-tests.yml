name: Atividade 3 - MPI Scatter/Gather

on:
  push:
  pull_request:

jobs:
  mpi-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Compilar
        run: |
          mpicc atividade3.c -o atividade3

      - name: Executar
        run: |
          mpirun --allow-run-as-root --oversubscribe -np 5 ./atividade3
